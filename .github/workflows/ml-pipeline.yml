name: ML Pipeline

# Required environment-scoped GitHub secrets:
#   GCP_WORKLOAD_IDENTITY_PROVIDER - Workload Identity Federation provider resource
#   GCP_SERVICE_ACCOUNT - service account email with permissions:
#     - BigQuery Data Editor
#     - Vertex AI User
#     - Storage Admin (for GCS model upload)
#
# Required environment-scoped GitHub variables:
#   GCP_PROJECT_ID
#   GCP_REGION
#   GCS_BUCKET

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub environment containing GCP vars/secrets'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      mode:
        description: 'Pipeline mode'
        required: true
        default: 'retrain'
        type: choice
        options:
          - retrain          # Vertex AI training on existing data (no ingestion)
          - full             # Ingest, then Vertex AI training
          - vertex           # Same as retrain
          - local            # Local training; no cloud writes
      max_pages:
        description: 'Maximum source pages per sold-date window (full mode only)'
        required: false
        default: '5'
        type: string
      start_date:
        description: 'First sold date to ingest, YYYY-MM-DD (full mode only; empty uses the evi backfill default)'
        required: false
        default: ''
        type: string
      config_file:
        description: 'Booli ingestion config file'
        required: false
        default: 'src/estate_value_index/ingestion/config/booli_all_locations.json'
        type: string
      tune:
        description: 'Tune one LightGBM parameter set per production model'
        required: false
        default: false
        type: boolean
      approved:
        description: 'Approve spend and production writes (BigQuery, Vertex AI, GCS); a local run does not need it'
        required: true
        default: false
        type: boolean
jobs:
  ml-pipeline:
    name: Run ML Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hours for full pipeline
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      BIGQUERY_PROJECT_ID: ${{ vars.BIGQUERY_PROJECT_ID || vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      BOOLI_API_CALLER_ID: ${{ secrets.BOOLI_API_CALLER_ID }}
      BOOLI_API_PRIVATE_KEY: ${{ secrets.BOOLI_API_PRIVATE_KEY }}
      BIGQUERY_DATASET_RAW: ${{ vars.BIGQUERY_DATASET_RAW || 'booli_raw' }}
      BIGQUERY_TABLE_LISTINGS: ${{ vars.BIGQUERY_TABLE_LISTINGS || 'listings' }}
      LISTINGS_FILE: data/raw/booli/booli_listings_prod.json
      MODEL_DIR: web/models

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Require approval
        run: |
          if [ "${{ inputs.mode }}" != "local" ] && [ "${{ inputs.approved }}" != "true" ]; then
            echo "Refused: this run spends money or writes to production and needs the approved input set to true"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Validate environment configuration
        run: |
          test -n "${GCP_PROJECT_ID}" || { echo "GCP_PROJECT_ID environment variable is required"; exit 1; }
          test -n "${BIGQUERY_PROJECT_ID}" || { echo "BIGQUERY_PROJECT_ID environment variable is required"; exit 1; }
          test -n "${GCP_REGION}" || { echo "GCP_REGION environment variable is required"; exit 1; }
          test -n "${GCS_BUCKET}" || { echo "GCS_BUCKET environment variable is required"; exit 1; }
          if [ "${{ inputs.mode }}" = "full" ]; then
            test -n "${BOOLI_API_CALLER_ID}" || { echo "BOOLI_API_CALLER_ID secret is required in full mode"; exit 1; }
            test -n "${BOOLI_API_PRIVATE_KEY}" || { echo "BOOLI_API_PRIVATE_KEY secret is required in full mode"; exit 1; }
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Ingest listings into BigQuery
        if: inputs.mode == 'full'
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
          MAX_PAGES: ${{ inputs.max_pages }}
          START_DATE: ${{ inputs.start_date }}
        run: |
          args=(--base-config "$CONFIG_FILE" --max-pages "$MAX_PAGES" --load --approved)
          if [ -n "$START_DATE" ]; then args+=(--start-date "$START_DATE"); fi
          uv run evi --json backfill "${args[@]}"

      - name: Sync listings from BigQuery
        if: inputs.mode != 'full'
        run: uv run evi sync --output "$LISTINGS_FILE"

      - name: Build the Vertex training container for this commit
        if: inputs.mode != 'local'
        run: ./vertex_ai/build_and_push.sh --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --tag "$GITHUB_SHA" --approved

      - name: Train locally
        if: inputs.mode == 'local'
        run: |
          args=(--data-source json --data-file "$LISTINGS_FILE" --model-dir "$MODEL_DIR")
          if [ "${{ inputs.tune }}" = "true" ]; then args+=(--tune); fi
          uv run evi train-production-models "${args[@]}"

      - name: Train on Vertex AI
        id: vertex
        if: inputs.mode != 'local'
        run: |
          image_uri="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/vertex-training/lgbm-trainer:${GITHUB_SHA}"
          args=(--model-dir "$MODEL_DIR" --image-uri "$image_uri" --approved)
          if [ "${{ inputs.tune }}" = "true" ]; then args+=(--tune); fi
          uv run evi vertex-train "${args[@]}" > vertex-train.json
          cat vertex-train.json
          echo "model_uri=$(jq -er .model_uri vertex-train.json)" >> "$GITHUB_OUTPUT"

      - name: Quality gate
        run: uv run evi check-model --model-dir "$MODEL_DIR"

      - name: Promote the model to production
        if: inputs.mode != 'local'
        env:
          MODEL_URI: ${{ steps.vertex.outputs.model_uri }}
        run: uv run evi promote-model --model-uri "$MODEL_URI" --approved

      - name: Generate analytics
        run: |
          uv run evi value-analysis --data-file "$LISTINGS_FILE" --models-dir "$MODEL_DIR" --no-training-filters
          uv run evi areas --data-source bigquery \
            --feature-context "$MODEL_DIR/price_prediction_model_no_list_price_feature_context.json" \
            --value-analysis data/derived/value_analysis.json \
            --raw-listings "$LISTINGS_FILE"
          uv run evi overall-stats --data-source bigquery \
            --value-analysis data/derived/value_analysis.json \
            --raw-listings "$LISTINGS_FILE"

      - name: Upload analytics to GCS
        if: inputs.mode != 'local'
        run: uv run evi upload-enrichment --approved

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-artifacts-${{ github.sha }}
          path: |
            web/models/*.joblib
            web/models/*.json
            vertex-train.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "## ML Pipeline Summary"
            echo "Mode: ${{ inputs.mode }}"
            echo "Tune: ${{ inputs.tune }}"
            echo "Commit SHA: ${{ github.sha }}"
            if [ -f "$MODEL_DIR/price_prediction_model_no_list_price_metrics.json" ]; then
              echo ""
              echo "## no_list_price metrics"
              echo '```json'
              jq '{median_ape, mae, rmse, mape, within_10_pct, n_train, n_test, data_fingerprint}' \
                "$MODEL_DIR/price_prediction_model_no_list_price_metrics.json"
              echo '```'
            fi
            echo ""
            echo "Deploy the serving app with the Deploy Web App workflow (deploy.yml)."
          } >> "$GITHUB_STEP_SUMMARY"
