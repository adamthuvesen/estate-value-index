[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "estate-value-index"
version = "1.0.0"
description = "Swedish real estate ML system: authorized listings → BigQuery → LightGBM → Next.js"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Estate Value Index Team"}
]
keywords = ["real-estate", "machine-learning", "property-valuation", "sweden"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]

# Core dependencies (production runtime)
dependencies = [
    # Ingestion adapter
    "requests>=2.31.0",

    # Data processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",

    # Machine learning
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",

    # API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings==2.14.1",

    # GCP
    "google-cloud-storage>=2.10.0",
    "google-cloud-bigquery>=3.10.0",
    "google-cloud-bigquery-storage>=2.0.0",
    "db-dtypes>=1.4.0",

    # Utilities (python-dotenv: pydantic-settings reads .env through it)
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# ML training dependencies
ml = [
    "lightgbm>=4.0.0",
    "optuna>=3.0.0",
]

# Development dependencies
# `[dev]` pulls in every extra needed to actually run the test suite, so a
# fresh worktree can `uv pip install -e ".[dev]"` and have pytest collect
# without chasing ad-hoc deps (matplotlib, seaborn, geopy, etc.).
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pre-commit>=4.0.0",
    "httpx>=0.28.1",
    "estate-value-index[ml,viz,geo,analysis]",
]

# Visualization dependencies
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
]

# Analysis extras: scipy for value analysis; pyarrow for Arrow-backed BigQuery results
analysis = [
    "pyarrow>=12.0.0",
    "scipy>=1.10.0",
]

# Geocoding and POI features
geo = [
    "geopy>=2.4.0",
    "h3>=4.0.0",
]

# All optional dependencies
all = [
    "estate-value-index[ml,dev,viz,analysis,geo]",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "import-linter==2.11",
    "pandas-stubs==2.3.3.260113",
    "ruff==0.17.4",
    "scipy-stubs==1.18.1.1",
    "types-requests==2.33.0.20261030",
    "types-seaborn==0.13.2.20261107",
]

[project.scripts]
evi = "estate_value_index.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/adamthuvesen/estate-value-index"
Documentation = "https://github.com/adamthuvesen/estate-value-index/tree/main/docs"
Repository = "https://github.com/adamthuvesen/estate-value-index"
Issues = "https://github.com/adamthuvesen/estate-value-index/issues"

# =============================================================================
# Tool Configuration
# =============================================================================

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
estate_value_index = ["ml/reference/*/*.csv", "ingestion/config/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["estate_value_index*"]
namespaces = false

# =============================================================================
# Pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root holds api_server.py, which tests import as a module.
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=estate_value_index",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=59",
]
markers = [
    "unit: Fast unit tests (no external dependencies)",
    "integration: Integration tests (database, API, etc.)",
    "e2e: End-to-end tests (full pipeline)",
    "slow: Slow-running tests (>10 seconds)",
    "bigquery: Tests requiring BigQuery access",
    "gcs: Tests requiring GCS access",
    "vertex: Tests requiring Vertex AI access",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
    "web",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "SIM", # flake8-simplify
    "C4", # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
    "PGH003", # blanket type: ignore
    "PGH004", # blanket noqa
    "UP", # pyupgrade
    "TID251", # banned-api: process and network calls outside their owners
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

# Size-bucket labels ("40–50") and docs use the en dash and multiplication sign on purpose.
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__ files
"tests/*" = ["B011", "TID251"]  # assert False; tests may spawn processes
"src/estate_value_index/ingestion/booli/api.py" = ["TID251"]  # sole owner of urllib.request

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Whole modules (subprocess, requests, google, ...) are banned by the import-linter
# contracts below, which give exact per-module owners. Ruff covers what import-linter
# cannot see: submodules of the standard library and attribute calls.
"urllib.request".msg = "Network client: only ingestion/booli/api.py may use it."
"http.client".msg = "Network client: not allowed."
"os.system".msg = "Process call: use cli/vertex_train.py."
"os.popen".msg = "Process call: use cli/vertex_train.py."
"os.execl".msg = "Process call: use cli/vertex_train.py."
"os.execle".msg = "Process call: use cli/vertex_train.py."
"os.execlp".msg = "Process call: use cli/vertex_train.py."
"os.execlpe".msg = "Process call: use cli/vertex_train.py."
"os.execv".msg = "Process call: use cli/vertex_train.py."
"os.execve".msg = "Process call: use cli/vertex_train.py."
"os.execvp".msg = "Process call: use cli/vertex_train.py."
"os.execvpe".msg = "Process call: use cli/vertex_train.py."
"os.spawnl".msg = "Process call: use cli/vertex_train.py."
"os.spawnle".msg = "Process call: use cli/vertex_train.py."
"os.spawnlp".msg = "Process call: use cli/vertex_train.py."
"os.spawnlpe".msg = "Process call: use cli/vertex_train.py."
"os.spawnv".msg = "Process call: use cli/vertex_train.py."
"os.spawnve".msg = "Process call: use cli/vertex_train.py."
"os.spawnvp".msg = "Process call: use cli/vertex_train.py."
"os.spawnvpe".msg = "Process call: use cli/vertex_train.py."
"os.posix_spawn".msg = "Process call: use cli/vertex_train.py."
"os.posix_spawnp".msg = "Process call: use cli/vertex_train.py."
"asyncio.subprocess".msg = "Process call: use cli/vertex_train.py."
"asyncio.create_subprocess_exec".msg = "Process call: use cli/vertex_train.py."
"asyncio.create_subprocess_shell".msg = "Process call: use cli/vertex_train.py."

[tool.ruff.lint.isort]
known-first-party = ["estate_value_index"]
known-third-party = ["pandas", "numpy", "sklearn", "lightgbm"]

# =============================================================================
# basedpyright Configuration
# =============================================================================

[tool.basedpyright]
include = ["src", "api_server.py", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportIgnoreCommentWithoutRule = "error"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false
executionEnvironments = [
    { root = "tests", extraPaths = ["."], reportMissingParameterType = false, reportPrivateUsage = false },
    { root = ".", extraPaths = ["."] },
]

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["src/estate_value_index"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# =============================================================================
# Import Linter Configuration
# =============================================================================

[tool.importlinter]
root_packages = ["estate_value_index", "scripts"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
containers = ["estate_value_index"]
layers = [
    "cli",
    "analytics",
    "ml | ingestion",
    "areas",
    "utils",
    "exceptions",
]

[[tool.importlinter.contracts]]
name = "Process modules"
type = "forbidden"
source_modules = ["estate_value_index", "scripts"]
forbidden_modules = ["subprocess", "pty"]
allow_indirect_imports = true
ignore_imports = [
    "estate_value_index.cli.vertex_train -> subprocess",
]

[[tool.importlinter.contracts]]
name = "Network clients"
type = "forbidden"
source_modules = ["estate_value_index", "scripts"]
forbidden_modules = ["requests", "httpx", "socket"]
allow_indirect_imports = true
ignore_imports = [
    "scripts.fetch_economic_data -> requests",
]

[[tool.importlinter.contracts]]
name = "Google Cloud SDKs"
type = "forbidden"
source_modules = ["estate_value_index", "scripts"]
forbidden_modules = ["google"]
allow_indirect_imports = true
ignore_imports = [
    "estate_value_index.ingestion.bigquery_upload -> google",
    "estate_value_index.ingestion.geocoding -> google",
    "estate_value_index.ml.data_loader -> google",
    "estate_value_index.utils.bigquery_safety -> google",
    "estate_value_index.utils.clients -> google",
]
