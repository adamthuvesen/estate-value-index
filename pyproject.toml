[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "estate-value-index"
version = "1.0.0"
description = "Swedish real estate ML system: authorized listings → BigQuery → LightGBM → Next.js"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Estate Value Index Team"}
]
keywords = ["real-estate", "machine-learning", "property-valuation", "sweden"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]

# Core dependencies (production runtime)
dependencies = [
    # Ingestion adapter
    "requests>=2.31.0",

    # Data processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",

    # Machine learning
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",

    # API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",

    # GCP
    "google-cloud-storage>=2.10.0",
    "google-cloud-bigquery>=3.10.0",
    "google-cloud-bigquery-storage>=2.0.0",
    "db-dtypes>=1.4.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# ML training dependencies
ml = [
    "lightgbm>=4.0.0",
    "optuna>=3.0.0",
]

# Prefect pipeline orchestration (ingestion/training/analytics flows). Not
# needed to serve predictions — api_server.py never imports
# estate_value_index.pipelines — so keeping it out of the base dependencies
# keeps prefect and its dependency tree out of the serving Docker image.
pipeline = [
    "prefect>=3.0.0",
]

# Development dependencies
# `[dev]` pulls in every extra needed to actually run the test suite, so a
# fresh worktree can `uv pip install -e ".[dev]"` and have pytest collect
# without chasing ad-hoc deps (matplotlib, seaborn, geopy, etc.).
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pre-commit>=4.0.0",
    "httpx>=0.28.1",
    "estate-value-index[ml,pipeline,viz,geo,analysis]",
]

# Visualization dependencies
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
]

# Analysis extras: scipy for value analysis; pyarrow for Arrow-backed BigQuery results
analysis = [
    "pyarrow>=12.0.0",
    "scipy>=1.10.0",
]

# Geocoding and POI features
geo = [
    "geopy>=2.4.0",
    "h3>=4.0.0",
]

# All optional dependencies
all = [
    "estate-value-index[ml,dev,pipeline,viz,analysis,geo]",
]

[dependency-groups]
dev = [
    "ruff==0.17.4",
]

[project.scripts]
evi = "estate_value_index.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/adamthuvesen/estate-value-index"
Documentation = "https://github.com/adamthuvesen/estate-value-index/tree/main/docs"
Repository = "https://github.com/adamthuvesen/estate-value-index"
Issues = "https://github.com/adamthuvesen/estate-value-index/issues"

# =============================================================================
# Tool Configuration
# =============================================================================

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["estate_value_index*"]
namespaces = false

# =============================================================================
# Pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=estate_value_index",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=59",
]
markers = [
    "unit: Fast unit tests (no external dependencies)",
    "integration: Integration tests (database, API, etc.)",
    "e2e: End-to-end tests (full pipeline)",
    "slow: Slow-running tests (>10 seconds)",
    "bigquery: Tests requiring BigQuery access",
    "gcs: Tests requiring GCS access",
    "vertex: Tests requiring Vertex AI access",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
    "web",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "SIM", # flake8-simplify
    "C4", # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
    "PGH003", # blanket type: ignore
    "PGH004", # blanket noqa
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

# Size-bucket labels ("40–50") and docs use the en dash and multiplication sign on purpose.
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__ files
"tests/*" = ["B011", "E402"]  # assert False; sys.path before imports

[tool.ruff.lint.isort]
known-first-party = ["estate_value_index"]
known-third-party = ["pandas", "numpy", "sklearn", "lightgbm", "prefect"]

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["src/estate_value_index"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
